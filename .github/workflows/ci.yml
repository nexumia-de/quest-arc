# Checks every pull request and every push to main: format, lint,
# typecheck, tests and build (npm run check), then keeps the plugin ZIP
# as an artifact so it can be tried in Super Productivity. The engine's
# test vectors also run in gjs (QUESTARC_GJS), the runtime Pensum uses.
# The job speed-aarch64 runs the engine's speed budget (large archive) in Node
# and in gjs on an arm64 runner and writes the times and the CPU to the job
# summary (issue #83). The job real-app installs the plugin in Super Productivity's web app at
# a pinned version (packages/plugin/e2e/Dockerfile) and walks the first
# stage of a journey in it, at phone and desktop size; real-app-newest does
# the same in the newest Super Productivity (packages/plugin/e2e/newest,
# issue #102, not a required check). The job standalone-app
# (issue #93, a spike, not a required check) walks the standalone web app
# in a browser, offline after the first load, and imports its export into
# the same Super Productivity. The job deploy puts the built app on
# Cloudflare after check and standalone-app pass: a push to main to
# questarc.nexumia.de, a pull request from this repository to a preview
# of its own, linked in a comment (docs/pwa-release.md). Without the
# Cloudflare secrets, and for forks and Dependabot, it skips the upload.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install gjs for the engine's test vectors
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gjs
      - run: npm ci
      - run: npm run check
        env:
          QUESTARC_GJS: gjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: questarc-plugin
          path: packages/plugin/dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: questarc-app
          path: packages/app/dist/app/
          if-no-files-found: error

  speed-aarch64:
    name: speed-aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install gjs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gjs
      - run: npm ci
      - name: Speed budget in Node and gjs, times to the job summary
        run: |
          {
            echo "### Engine speed on $(uname -m)"
            echo
            echo "CPU: $(lscpu | sed -n 's/^Model name: *//p' | head -1), $(nproc) cores; gjs $(gjs --version)"
            echo
            echo "| Runtime | Measured | Archive | ms per run | best ms |"
            echo "| --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          npm run build -w @questarc/engine
          QUESTARC_SPEED_REPORT="$GITHUB_STEP_SUMMARY" npx vitest run test/speed.test.ts
        working-directory: packages/engine
        env:
          QUESTARC_GJS: gjs

  real-app:
    name: real-app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start Super Productivity at the pinned version
        run: |
          docker build -t questarc-sp packages/plugin/e2e
          docker run -d -p 8080:80 questarc-sp
          timeout 60 bash -c 'until curl -sf -o /dev/null http://localhost:8080/; do sleep 2; done'
      - name: Install, start a journey, complete the task (phone and desktop)
        run: npm run e2e -w @questarc/plugin
        env:
          QUESTARC_SP_URL: http://localhost:8080/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: real-app-screenshots
          path: packages/plugin/dist/real-app/
          if-no-files-found: ignore

  real-app-newest:
    name: real-app-newest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start the newest Super Productivity
        run: |
          docker build -t questarc-sp-newest packages/plugin/e2e/newest
          docker run -d -p 8080:80 questarc-sp-newest
          timeout 60 bash -c 'until curl -sf -o /dev/null http://localhost:8080/; do sleep 2; done'
      - name: Install, start a journey, complete the task (phone and desktop)
        run: npm run e2e -w @questarc/plugin
        env:
          QUESTARC_SP_URL: http://localhost:8080/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: real-app-newest-screenshots
          path: packages/plugin/dist/real-app/
          if-no-files-found: ignore

  standalone-app:
    name: standalone-app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Walk the app (phone and desktop), offline after the first load
        run: npm run e2e -w @questarc/app
      - name: Start Super Productivity at the pinned version
        run: |
          docker build -t questarc-sp packages/plugin/e2e
          docker run -d -p 8080:80 questarc-sp
          timeout 60 bash -c 'until curl -sf -o /dev/null http://localhost:8080/; do sleep 2; done'
      - name: Import the app's export, no repair, the plugin shows the same journey
        run: npm run e2e:import -w @questarc/app
        env:
          QUESTARC_SP_URL: http://localhost:8080/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: standalone-app-walk
          path: packages/app/dist/walk/
          if-no-files-found: ignore

  deploy:
    name: deploy
    needs: [check, standalone-app]
    # Forks and Dependabot get no secrets: skip instead of failing.
    if: >-
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    # One upload per branch at a time; a running one is finished.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Cloudflare secrets present
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Cloudflare secrets in this repository: nothing deployed (docs/pwa-release.md)."
          fi
      - if: steps.secrets.outputs.ok
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.secrets.outputs.ok
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/wrangler/package-lock.json
      - name: Install the pinned wrangler
        if: steps.secrets.outputs.ok
        run: npm ci --ignore-scripts --prefix tools/wrangler
      - name: Read the wrangler version
        if: steps.secrets.outputs.ok
        id: wrangler
        run: echo "version=$(node -p "require('./tools/wrangler/package.json').devDependencies.wrangler")" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.ok
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: questarc-app
          path: packages/app/dist/app
      # main: production at questarc.nexumia.de; a pull request: the
      # preview pr-<number>, removed by cleanup-preview.yml.
      - name: Upload to Cloudflare
        if: steps.secrets.outputs.ok
        id: cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ steps.wrangler.outputs.version }}
          workingDirectory: tools/wrangler
          command: >-
            ${{ github.event_name == 'push' && 'deploy' ||
            format('preview --name pr-{0}', github.event.pull_request.number) }}
            --config ../../packages/app/wrangler.jsonc
      # A broken upload fails here instead of going unnoticed.
      - name: The deployed app answers
        if: steps.secrets.outputs.ok
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = push ]; then url=https://questarc.nexumia.de/; else url="$DEPLOYMENT_URL"; fi
          [ -n "$url" ] || { echo "wrangler named no preview URL"; exit 1; }
          url="${url%/}/"
          get() { curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$@"; }
          page="$(get "$url")"
          grep -q '<title>QuestArc: Habit Journeys</title>' <<< "$page" || { echo "no app page at $url"; exit 1; }
          get -o /dev/null "${url}manifest.webmanifest"
          headers="$(get -o /dev/null -D - "${url}sw.js")"
          grep -qi '^cache-control: no-cache' <<< "$headers" || { echo "sw.js without no-cache at $url"; exit 1; }
          echo "the app answers at $url"
      - name: Link the preview in the pull request
        if: steps.secrets.outputs.ok && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        with:
          script: |
            const comment = require('./.github/scripts/preview-comment.cjs');
            await comment({ github, context, core }, process.env.DEPLOYMENT_URL);
