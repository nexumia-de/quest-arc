# Publishes the standalone app (packages/app) as a PWA on GitHub Pages,
# https://nexumia-de.github.io/quest-arc/ (docs/pwa-release.md). It runs
# for a tag app-v<version>, which must match the version in
# packages/app/package.json, apart from the plugin's v<version>; by hand
# (workflow_dispatch) it publishes the chosen branch or tag. Owner steps:
# Pages set to the source "GitHub Actions", and the environment
# github-pages allowing the tags app-v* (docs/pwa-release.md). The
# app's paths are relative, so it needs no base path from Pages.
name: Pages

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a running one is finished, not cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./packages/app/package.json').version")
          test "app-v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match app version $version"; exit 1; }
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: The PWA under /quest-arc/, the walk offline after the first load
        run: npm run e2e -w @questarc/app
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/app/dist/app

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
